  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: {{SLUG}}-db
    volumes:
      - ./database:/var/lib/mysql
      - ./mysql/logs:/var/lib/mysql-logs
      # SQL files here run once, when ./database is empty
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
{{DB_PORTS}}    environment:
      MYSQL_ROOT_PASSWORD: {{DB_PASS}}
      MYSQL_DATABASE: {{DB_NAME}}
      TZ: Europe/Paris
    command: ['mysqld', '--default-time-zone=Europe/Paris']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      timeout: 20s
      retries: 10
      interval: 5s
      start_period: 30s
    networks:
      - {{SLUG}}-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '2G'

  phpmyadmin:
    image: phpmyadmin
    container_name: {{SLUG}}-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 200M
      TZ: Europe/Paris
    ports:
      - '{{PMA_PORT}}:80'
    networks:
      - {{SLUG}}-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

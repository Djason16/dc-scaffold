  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: {{SLUG}}-backend
    volumes:
      - ./backend:/var/www/html/
      - ./backend/php.ini:/usr/local/etc/php/php.ini
    ports:
      - '{{API_PORT}}:80'
    networks:
      - {{SLUG}}-network
{{API_DEPENDS_ON}}    restart: on-failure
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      TZ: Europe/Paris
      # Set to "debug" to enable Xdebug (trigger mode, port 9003)
      XDEBUG_MODE: 'off'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '2G'

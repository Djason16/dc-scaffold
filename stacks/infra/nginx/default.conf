# Development server for the static front (frontend/), same rules as the .htaccess used online
server {
    listen 80;
    root /usr/share/nginx/html;

    # Bind-mounted files from Windows: disable sendfile and caching so edits show up immediately
    sendfile off;
    add_header Cache-Control "no-store";

    # Unknown address: pages/404.html
    error_page 404 /pages/404.html;

    # Home page
    location = / {
        try_files /pages/index.html =404;
    }

    # Files (css, js, images) as they are; /about and /about/ serve pages/about.html
    location / {
        rewrite ^/(.+)/$ /$1;
        try_files $uri /pages$uri.html =404;
    }
}
